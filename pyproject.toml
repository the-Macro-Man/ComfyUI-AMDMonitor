[project]
name = "comfyui-amdmonitor"
description = "VRAM monitor and run notifications for AMD / ROCm GPUs in ComfyUI, where NVML-based monitors show nothing. This extension shows VRAM, peak usage, and tells you when your render finishes. Features - VRAM per GPU, Peak VRAM per run, Finish notifications, Failure alerts, Offload warning, Run timer, Everything toggleable, Draggable, collapsible and remembers its position"
version = "1.4.0"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.urls]
Repository = "https://github.com/the-Macro-Man/ComfyUI-AMDMonitor"

[tool.comfy]
PublisherId = "the-macroman"
DisplayName = "AMD Monitor"
Icon = "https://raw.githubusercontent.com/the-Macro-Man/ComfyUI-AMDMonitor/main/icon.png"
